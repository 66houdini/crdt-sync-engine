<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRDT relay demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 46rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 0.25rem;
      }
      p {
        margin: 0 0 1rem;
        opacity: 0.75;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.5rem;
      }
      #status {
        flex: 1;
        font: 0.85rem ui-monospace, monospace;
      }
      #status::before {
        content: "●  ";
        color: #c0392b;
      }
      #status[data-state="online"]::before {
        color: #27ae60;
      }
      button {
        font: inherit;
        padding: 0.3rem 0.8rem;
      }
      .editor {
        position: relative;
        height: 60vh;
      }
      /* The textarea and the mirror behind it must lay text out identically. */
      textarea,
      #mirror {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0.75rem;
        border: 1px solid #8886;
        font: 1rem/1.5 ui-monospace, monospace;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        overflow-y: scroll;
        tab-size: 4;
      }
      textarea {
        background: transparent;
        color: inherit;
        resize: none;
      }
      #mirror {
        color: transparent;
        border-color: transparent;
        pointer-events: none;
        user-select: none;
      }
      .caret {
        position: relative;
        border-left: 2px solid var(--c);
        margin-left: -1px;
        margin-right: -1px;
      }
      .caret::after {
        content: attr(data-name);
        position: absolute;
        left: -2px;
        bottom: 100%;
        padding: 0 0.3rem;
        border-radius: 3px 3px 3px 0;
        background: var(--c);
        color: #fff;
        font: 0.65rem/1.4 system-ui, sans-serif;
        white-space: nowrap;
      }
      #peers {
        min-height: 1.4rem;
        margin-bottom: 0.4rem;
        font-size: 0.8rem;
      }
      .chip {
        display: inline-block;
        margin-right: 0.35rem;
        padding: 0 0.4rem;
        border-radius: 3px;
        background: var(--c);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>Document <code id="doc"></code></h1>
    <p>
      Open this page in a second tab and type in both. Use the button to drop the connection, keep typing, then
      reconnect: the edits merge. Add <code>?doc=name</code> to the address for a different document.
    </p>
    <div class="bar">
      <span id="status"></span>
      <button id="toggle" type="button">Go offline</button>
    </div>
    <div id="peers" aria-live="polite"></div>
    <div class="editor">
      <div id="mirror" aria-hidden="true"></div>
      <textarea id="editor" spellcheck="false" autofocus aria-label="Shared document"></textarea>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
