name = "crdt-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# The browser demo page (index.html plus the bundled client). Anything that is not a
# static file falls through to the Worker.
[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "DOCUMENT_DO"
class_name = "DocumentDO"

# Free tier: Durable Objects must be SQLite-backed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentDO"]

# Optional: archive superseded snapshots and compacted log segments to R2.
# R2 has a free tier but must be enabled on the account first; then run
#   wrangler r2 bucket create crdt-relay-snapshots
# and uncomment. Without it the relay simply discards what it compacts away.
# [[r2_buckets]]
# binding = "SNAPSHOT_ARCHIVE"
# bucket_name = "crdt-relay-snapshots"

# Limits for the public demo. Every value is optional; src/document-do.ts has the defaults
# (keep documents forever, 500000 elements, 64 connections, 3000-op burst refilled at 300/s,
# snapshot every 5000 ops with a 1000-op log tail).
[vars]
DOC_TTL_SECONDS = "604800"    # delete a document after 7 idle days
MAX_DOC_ELEMENTS = "200000"   # live characters plus tombstones
# MAX_CONNECTIONS = "64"
# RATE_BURST = "3000"
# RATE_PER_SECOND = "300"
# SNAPSHOT_EVERY_OPS = "5000"
# LOG_TAIL_OPS = "1000"
